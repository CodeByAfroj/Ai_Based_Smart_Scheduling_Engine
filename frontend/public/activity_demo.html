<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Classifier Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #0a0b10; color: #e2e8f0; }
        h1, h2 { color: #f8fafc; }
        .card { border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        .status { font-size: 1.2em; font-weight: bold; margin-top: 8px; padding: 8px; border-radius: 4px; display: inline-block; }
        .status.free { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .status.busy { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .hidden { display: none; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 1em; margin-bottom: 10px; }
        button:hover { background: #2563eb; }
        #fallback-ui button { margin-right: 8px; margin-top: 8px; }
    </style>
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

    <h1>Activity Classifier</h1>
    
    <div id="sensor-ui" class="card hidden">
        <h2>Sensor Based Detection</h2>
        <p>Using device accelerometer/gyroscope to detect activity.</p>
        <button id="start-sensors-btn">Start Sensor Collection</button>
        <div id="sensor-status" style="margin-top: 10px; color: #94a3b8;">Waiting to start...</div>
    </div>
    
    <div id="fallback-ui" class="card hidden">
        <h2>Manual Status Override</h2>
        <p>Sensors not available on this device. Please select your status manually:</p>
        <button data-activity="working" data-busy="true">Working</button>
        <button data-activity="in_meeting" data-busy="true">In a Meeting</button>
        <button data-activity="free" data-busy="false">Free</button>
    </div>

    <div class="card">
        <h2>Current State</h2>
        <div style="margin-bottom: 8px;">Activity: <span id="current-activity" style="font-weight: bold;">Unknown</span></div>
        <div class="status" id="busy-status">Unknown</div>
    </div>

    <!-- Application Logic -->
    <script src="/features.js"></script>
    <script src="/sensor.js"></script>
    <script src="/fallback.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hasMotion = typeof DeviceMotionEvent !== 'undefined';
            const isTouch = window.matchMedia("(pointer: coarse)").matches;
            
            if (hasMotion && isTouch) {
                document.getElementById('sensor-ui').classList.remove('hidden');
                if (window.initSensorLogic) initSensorLogic();
            } else {
                document.getElementById('fallback-ui').classList.remove('hidden');
                if (window.initFallbackLogic) initFallbackLogic();
            }
        });
        
        window.updateGlobalState = function(activity, busy) {
            document.getElementById('current-activity').innerText = activity;
            const statusEl = document.getElementById('busy-status');
            statusEl.innerText = busy ? "BUSY" : "FREE";
            statusEl.className = 'status ' + (busy ? 'busy' : 'free');
            console.log("State updated:", { activity, busy });
        };
    </script>
</body>
</html>
